services:
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8766:8766"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ALLOW_SQLITE_PRODUCTION: ${ALLOW_SQLITE_PRODUCTION:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:8766}
      HOST: 0.0.0.0
      PORT: 8766
      DATA_DIR: /app/data
      SESSION_DAYS: ${SESSION_DAYS:-7}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      POSTGRES_SSL_CA: ${POSTGRES_SSL_CA:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-}
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8766/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: interior
      POSTGRES_USER: interior
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interior -d interior"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  app-data:
  postgres-data:
